# Californium3 CoAP Configuration

# Network Configuration
COAP_PORT=5683
COAP_SECURE_PORT=5684

# Protocol Configuration
MAX_MESSAGE_SIZE=1024
PREFERRED_BLOCK_SIZE=512
MAX_RESOURCE_BODY_SIZE=8192

# Congestion Control
CONGESTION_CONTROL_ALGORITHM=Cocoa

# Exchange Lifetime
EXCHANGE_LIFETIME=247000

# ACK Configuration
ACK_TIMEOUT=2000
ACK_RANDOM_FACTOR=1.5
ACK_TIMEOUT_SCALE=2.0
MAX_RETRANSMIT=4

# Deduplication
DEDUPLICATION_AUTO_REPLACE=true
MARK_AND_SWEEP_INTERVAL=10000
